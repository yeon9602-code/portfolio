<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f2342">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>신청 현황 대시보드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2342;--navy2:#1b3a6b;--gold:#c9a74a;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--bg:#f2f4f8;--ok:#15803d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:1.05rem;font-weight:500}
header h1 span{color:var(--gold)}
.live{display:flex;align-items:center;gap:6px;font-size:.75rem;opacity:.85}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;animation:pulse 1.6s infinite}
.dot.off{background:#f87171;animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
main{padding:14px;max-width:720px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{background:#fff;border-radius:12px;padding:14px 10px;text-align:center;box-shadow:0 2px 8px rgba(15,35,66,.06)}
.kpi b{display:block;font-size:1.7rem;color:var(--navy);line-height:1.1}
.kpi small{color:var(--muted);font-size:.74rem}
.kpi.hi b{color:var(--gold)}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(15,35,66,.06)}
.card h2{font-size:.9rem;color:var(--navy);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.card h2 small{color:var(--muted);font-weight:400;font-size:.75rem}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:.82rem}
.bar .lbl{width:118px;flex:none;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .trk{flex:1;height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.bar .fil{height:100%;background:linear-gradient(90deg,var(--navy2),var(--navy));border-radius:5px;transition:width .6s}
.bar .n{width:26px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:flex-end;gap:4px;height:60px}
.spark div{flex:1;background:var(--navy2);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.spark div.today{background:var(--gold)}
.days{display:flex;gap:4px;margin-top:4px}
.days span{flex:1;text-align:center;font-size:.62rem;color:var(--muted)}
.list{list-style:none}
.item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;flex:none;font-size:.95rem}
.item .body{flex:1;min-width:0}
.item .top{display:flex;justify-content:space-between;gap:8px}
.item .nm{font-weight:500}
.item .tm{color:var(--muted);font-size:.74rem;white-space:nowrap}
.item .sub{color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .chip{display:inline-block;background:#eef2f8;color:var(--navy2);font-size:.7rem;padding:1px 8px;border-radius:999px;margin-top:4px}
.item .memo{font-size:.8rem;color:var(--ink);margin-top:4px;background:var(--bg);padding:6px 8px;border-radius:6px}
.new{border-left:3px solid var(--gold);padding-left:9px;margin-left:-12px}
.empty{text-align:center;color:var(--muted);padding:30px 0;font-size:.9rem}
.setup{background:#fff;border-radius:12px;padding:22px 18px;box-shadow:0 2px 8px rgba(15,35,66,.06)}
.setup h2{color:var(--navy);font-size:1.05rem;margin-bottom:8px}
.setup p{font-size:.88rem;color:var(--muted);margin-bottom:14px}
.setup input{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit;font-size:.95rem;margin-bottom:10px}
.setup button{width:100%;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:13px;font:inherit;font-size:.95rem;font-weight:500}
.err{color:#dc2626;font-size:.82rem;margin-top:8px}
.foot{text-align:center;color:var(--muted);font-size:.72rem;padding:10px 0 20px}
.foot a{color:var(--navy2)}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>신청 현황 <span>LIVE</span></h1>
  <div class="live"><span class="dot" id="dot"></span><span id="status">연결 중</span></div>
</header>

<main>
<div id="setup" class="setup hidden">
  <h2>접속 설정</h2>
  <p>Apps Script 웹앱 URL과 대시보드 키를 입력하세요. 이 기기에만 저장되며, 이후에는 자동으로 접속됩니다.</p>
  <input id="inUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
  <input id="inKey" type="password" placeholder="대시보드 키" autocomplete="off">
  <button id="btnSave">연결</button>
  <div class="err" id="setupErr"></div>
</div>

<div id="dash" class="hidden">
  <div class="kpis">
    <div class="kpi hi"><b id="kTotal">–</b><small>총 신청</small></div>
    <div class="kpi"><b id="kToday">–</b><small>오늘</small></div>
    <div class="kpi"><b id="kWeek">–</b><small>최근 7일</small></div>
  </div>

  <div class="card">
    <h2>최근 14일 추이 <small id="trendMax"></small></h2>
    <div class="spark" id="spark"></div>
    <div class="days" id="days"></div>
  </div>

  <div class="card">
    <h2>관심 분야</h2>
    <div id="interest"></div>
  </div>

  <div class="card">
    <h2>최근 신청자 <small id="updated"></small></h2>
    <ul class="list" id="list"></ul>
  </div>

  <div class="foot">30초마다 자동 갱신 · <a href="#" id="reset">접속 설정 변경</a></div>
</div>
</main>

<script>
const LS='ea_dash_cfg'; let cfg=null, timer=null, lastCount=null;
const $=id=>document.getElementById(id);
function load(){try{cfg=JSON.parse(localStorage.getItem(LS));}catch(e){cfg=null}}
function show(id){['setup','dash'].forEach(x=>$(x).classList.toggle('hidden',x!==id));}
function setStatus(ok,txt){$('dot').className='dot'+(ok?'':' off');$('status').textContent=txt;}
const fmtT=d=>{const n=new Date(),diff=(n-d)/60000;if(diff<1)return'방금';if(diff<60)return Math.floor(diff)+'분 전';if(diff<1440&&d.toDateString()===n.toDateString())return d.toTimeString().slice(0,5);return(d.getMonth()+1)+'/'+d.getDate()+' '+d.toTimeString().slice(0,5);};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function fetchData(){
  if(!cfg)return;
  try{
    const r=await fetch(cfg.url+'?key='+encodeURIComponent(cfg.key)+'&_='+Date.now(),{cache:'no-store'});
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'error');
    render(j); setStatus(true,'실시간');
  }catch(e){
    setStatus(false,'연결 오류');
    if(String(e.message).includes('unauthorized')){localStorage.removeItem(LS);cfg=null;clearInterval(timer);show('setup');$('setupErr').textContent='키가 올바르지 않습니다.';}
  }
}

function render(j){
  const rows=j.rows.map(r=>({...r,d:new Date(r.t)})).sort((a,b)=>b.d-a.d);
  const now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const today=rows.filter(r=>r.d>=t0).length, week=rows.filter(r=>r.d>=new Date(t0-6*864e5)).length;
  $('kTotal').textContent=rows.length;$('kToday').textContent=today;$('kWeek').textContent=week;
  if(lastCount!==null&&rows.length>lastCount&&navigator.vibrate)navigator.vibrate(80);
  const isNew=lastCount!==null&&rows.length>lastCount; lastCount=rows.length;

  // 14일 추이
  const days=[];for(let i=13;i>=0;i--){const d=new Date(t0-i*864e5);days.push({d,n:0});}
  rows.forEach(r=>{const k=Math.floor((t0-new Date(r.d.getFullYear(),r.d.getMonth(),r.d.getDate()))/864e5);if(k>=0&&k<14)days[13-k].n++;});
  const mx=Math.max(1,...days.map(x=>x.n));$('trendMax').textContent='최대 '+mx+'건/일';
  $('spark').innerHTML=days.map((x,i)=>`<div class="${i===13?'today':''}" style="height:${Math.max(3,x.n/mx*100)}%" title="${x.n}"></div>`).join('');
  $('days').innerHTML=days.map((x,i)=>`<span>${i%2?'':(x.d.getMonth()+1)+'/'+x.d.getDate()}</span>`).join('');

  // 관심분야
  const cnt={};rows.forEach(r=>{const k=r.interest||'미선택';cnt[k]=(cnt[k]||0)+1;});
  const ent=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);const im=Math.max(1,...ent.map(e=>e[1]));
  $('interest').innerHTML=ent.length?ent.map(([k,v])=>`<div class="bar"><span class="lbl">${esc(k)}</span><div class="trk"><div class="fil" style="width:${v/im*100}%"></div></div><span class="n">${v}</span></div>`).join(''):'<div class="empty">아직 데이터가 없습니다</div>';

  // 리스트
  $('list').innerHTML=rows.length?rows.slice(0,50).map((r,i)=>`<li class="item ${isNew&&i===0?'new':''}"><div class="av">${esc(String(r.name).trim().slice(0,1))}</div><div class="body"><div class="top"><span class="nm">${esc(r.name)}</span><span class="tm">${fmtT(r.d)}</span></div><div class="sub">${esc(r.email)}${r.org?' · '+esc(r.org):''}</div>${r.interest?`<span class="chip">${esc(r.interest)}</span>`:''}${r.memo?`<div class="memo">${esc(r.memo)}</div>`:''}</div></li>`).join(''):'<li class="empty">아직 신청자가 없습니다.<br>가입 페이지를 공유해 보세요.</li>';
  $('updated').textContent='갱신 '+new Date().toTimeString().slice(0,8);
}

function start(){show('dash');fetchData();clearInterval(timer);timer=setInterval(fetchData,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)fetchData();});}

$('btnSave').onclick=()=>{const url=$('inUrl').value.trim(),key=$('inKey').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url))return $('setupErr').textContent='Apps Script 웹앱 URL 형식이 아닙니다.';if(!key)return $('setupErr').textContent='키를 입력하세요.';cfg={url,key};localStorage.setItem(LS,JSON.stringify(cfg));start();};
$('reset').onclick=e=>{e.preventDefault();localStorage.removeItem(LS);cfg=null;clearInterval(timer);show('setup');};

// URL 해시로 초기 설정 전달 가능: #url=...&key=...
(function(){const h=new URLSearchParams(location.hash.slice(1));if(h.get('url')&&h.get('key')){cfg={url:h.get('url'),key:h.get('key')};localStorage.setItem(LS,JSON.stringify(cfg));history.replaceState(null,'',location.pathname);}})();
load(); if(cfg)start(); else{show('setup');setStatus(false,'설정 필요');}
</script>
</body>
</html>
