<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>얼리 액세스 신청 | 연프로</title>
<meta name="description" content="초기 사용자 얼리 액세스 신청 페이지">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2342;--navy2:#1b3a6b;--gold:#c9a74a;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--bg:#f7f8fb;--err:#dc2626;--ok:#15803d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 60%,#24518f 100%);min-height:100vh;display:flex;flex-direction:column;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
header{padding:22px 24px;color:#fff;display:flex;justify-content:space-between;align-items:center;max-width:1080px;width:100%;margin:0 auto}
.logo{font-family:'Noto Serif KR',serif;font-weight:700;letter-spacing:.08em}
.logo span{color:var(--gold)}
header a.back{font-size:.88rem;opacity:.8}header a.back:hover{opacity:1;color:var(--gold)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:30px 20px 60px}
.card{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:44px 40px;box-shadow:0 30px 60px rgba(0,0,0,.25)}
@media(max-width:520px){.card{padding:32px 22px}}
.tag{display:inline-block;border:1px solid var(--gold);color:#9a7d2e;padding:3px 12px;border-radius:999px;font-size:.75rem;letter-spacing:.14em;margin-bottom:16px}
h1{font-family:'Noto Serif KR',serif;color:var(--navy);font-size:1.75rem;line-height:1.3;margin-bottom:10px}
.lead{color:var(--muted);font-size:.95rem;margin-bottom:30px}
label{display:block;font-size:.88rem;font-weight:500;margin-bottom:6px;color:var(--navy)}
label .req{color:var(--err)}
.field{margin-bottom:18px}
input[type=text],input[type=email],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:inherit;font-size:.95rem;background:#fafafa;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy2);background:#fff;box-shadow:0 0 0 3px rgba(27,58,107,.12)}
textarea{resize:vertical;min-height:84px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:.84rem;color:var(--muted);background:var(--bg);padding:14px;border-radius:8px;margin:6px 0 22px}
.consent input{margin-top:4px;flex:none;width:16px;height:16px;accent-color:var(--navy)}
.consent b{color:var(--ink);font-weight:500}
details{font-size:.8rem;color:var(--muted);margin-top:6px}
details summary{cursor:pointer;color:var(--navy2);font-weight:500}
details ul{padding-left:18px;margin-top:6px}
button{width:100%;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:14px;font:inherit;font-size:1rem;font-weight:500;cursor:pointer;transition:.2s}
button:hover{background:var(--navy2)}
button:disabled{opacity:.6;cursor:wait}
.msg{display:none;margin-top:16px;padding:14px;border-radius:8px;font-size:.92rem}
.msg.err{display:block;background:#fef2f2;color:var(--err);border:1px solid #fecaca}
.success{text-align:center;padding:20px 0}
.success .icon{width:64px;height:64px;border-radius:50%;background:#dcfce7;color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 18px}
.success h2{font-family:'Noto Serif KR',serif;color:var(--navy);margin-bottom:8px}
.success p{color:var(--muted);font-size:.95rem}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
footer{text-align:center;color:rgba(255,255,255,.6);font-size:.8rem;padding:18px}
</style>
</head>
<body>
<header><a href="../" class="logo">YEON<span>.</span>PRO</a><a href="../" class="back">← 포트폴리오로</a></header>
<main>
<div class="card">
<div id="formWrap">
<div class="tag">EARLY ACCESS</div>
<h1>초기 사용자 신청</h1>
<p class="lead">가장 먼저 사용해 보고 의견을 들려주실 분을 모십니다. 아래 정보를 남겨주시면 준비가 되는 대로 안내드리겠습니다.</p>

<form id="signupForm" novalidate>
<input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off">

<div class="field"><label for="name">이름 <span class="req">*</span></label>
<input type="text" id="name" name="이름" required autocomplete="name" placeholder="홍길동"></div>

<div class="field"><label for="email">이메일 <span class="req">*</span></label>
<input type="email" id="email" name="이메일" required autocomplete="email" placeholder="example@domain.com"></div>

<div class="field"><label for="org">소속 / 직무</label>
<input type="text" id="org" name="소속" placeholder="예: ○○공단 조사부 / 경찰 / 법무 / 기타"></div>

<div class="field"><label for="interest">관심 분야</label>
<select id="interest" name="관심분야">
<option value="">선택해 주세요</option>
<option>행정조사 실무</option>
<option>수사의뢰(고소·고발) 작성</option>
<option>판례·법령 분석</option>
<option>특사경 대비 교육</option>
<option>기타</option>
</select></div>

<div class="field"><label for="memo">기대하는 점 / 하고 싶은 말</label>
<textarea id="memo" name="메모" placeholder="선택 사항입니다."></textarea></div>

<label class="consent"><input type="checkbox" id="consent" required>
<span><b>개인정보 수집·이용에 동의합니다.</b> <span class="req">*</span><br>
수집 항목: 이름, 이메일, 소속(선택) · 목적: 초기 사용 안내 및 의견 수렴 · 보유 기간: 목적 달성 후 지체 없이 파기. 동의를 거부할 수 있으나 이 경우 신청이 제한됩니다.</span></label>

<button type="submit" id="submitBtn">신청하기</button>
<div class="msg" id="msg"></div>
</form>
</div>

<div class="success" id="success" style="display:none">
<div class="icon">✓</div>
<h2>신청이 접수되었습니다</h2>
<p>소중한 관심 감사합니다.<br>준비가 되는 대로 이메일로 안내드리겠습니다.</p>
</div>
</div>
</main>
<footer>© 2026 연프로</footer>

<script>
// ===== 설정: 폼 수신 엔드포인트 =====
// Formspree(https://formspree.io)에서 폼을 만들고 발급받은 URL을 아래에 넣으세요.
// 예: "https://formspree.io/f/abcdwxyz"
const ENDPOINT = "https://formspree.io/f/xyekwbqn";
// 대시보드용 Google Apps Script 웹앱 URL (비어 있으면 생략)
const SHEET_ENDPOINT = "SHEET_ENDPOINT_PLACEHOLDER";

const form=document.getElementById('signupForm'),btn=document.getElementById('submitBtn'),msg=document.getElementById('msg');
function showErr(t){msg.textContent=t;msg.className='msg err';}
form.addEventListener('submit',async e=>{
  e.preventDefault(); msg.className='msg';
  const name=form.이름.value.trim(), email=form.이메일.value.trim();
  if(!name) return showErr('이름을 입력해 주세요.');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showErr('올바른 이메일 주소를 입력해 주세요.');
  if(!document.getElementById('consent').checked) return showErr('개인정보 수집·이용에 동의해 주세요.');
  if(ENDPOINT.indexOf('PLACEHOLDER')>-1) return showErr('아직 폼 수신 설정이 완료되지 않았습니다. 관리자에게 문의해 주세요.');
  btn.disabled=true; btn.textContent='전송 중…';
  try{
    const fd=new FormData(form); fd.append('동의','예'); fd.append('_replyto',email); fd.append('_subject','[얼리 액세스 신청] '+name); fd.append('신청시각',new Date().toLocaleString('ko-KR'));
    const r=await fetch(ENDPOINT,{method:'POST',body:fd,headers:{'Accept':'application/json'}});
    if(!r.ok) throw new Error();
    if(SHEET_ENDPOINT.indexOf('PLACEHOLDER')<0){ try{ await fetch(SHEET_ENDPOINT,{method:'POST',body:fd,mode:'no-cors'}); }catch(_){} }
    document.getElementById('formWrap').style.display='none';
    document.getElementById('success').style.display='block';
  }catch(err){
    showErr('전송에 실패했습니다. 잠시 후 다시 시도해 주세요.');
    btn.disabled=false; btn.textContent='신청하기';
  }
});
</script>
</body>
</html>
